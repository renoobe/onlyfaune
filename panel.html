<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyFaune</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0e0e10;
            --bg-card: #18181b;
            --bg-elevated: #1f1f23;
            --border: #2d2d35;
            --text: #efeff1;
            --text-dim: #adadb8;
            --gold: #d4a842;
            --gold-bright: #f0c850;
            --green: #2d6a4f;
            --green-bright: #40916c;
            --radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.4;
            overflow-x: hidden;
            font-size: 13px;
        }

        .header {
            background: linear-gradient(135deg, #1a2a1a 0%, #0e1a0e 100%);
            padding: 10px 12px;
            border-bottom: 2px solid var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .logo { font-size: 1.15rem; font-weight: 800; color: var(--gold); letter-spacing: -.02em; }
        .header .session-name {
            font-size: .72rem;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .header .live-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #e91916;
            animation: blink 1.5s infinite;
            flex-shrink: 0;
        }
        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.3; } }

        .no-session {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-dim);
        }
        .no-session .icon { font-size: 2.5rem; margin-bottom: 8px; }

        .tabs {
            display: flex;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }
        .tab {
            flex: 1;
            padding: 8px 4px;
            text-align: center;
            font-size: .78rem;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 2px solid transparent;
            transition: all .15s;
        }
        .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ── Alert fullscreen ── */
        .alert {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a3a2a 0%, #0a1a0a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity .4s ease;
            text-align: center;
            padding: 24px 16px;
        }
        .alert.show { opacity: 1; pointer-events: auto; }
        .alert .alert-thumb {
            width: 120px; height: 120px;
            border-radius: 12px;
            object-fit: cover;
            border: 3px solid var(--gold);
            margin-bottom: 16px;
            box-shadow: 0 0 40px rgba(212,168,66,.3);
        }
        .alert .alert-text { }
        .alert .alert-label {
            font-size: .85rem;
            color: var(--gold-bright);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: .1em;
            margin-bottom: 6px;
            animation: alertPulse 1s infinite;
        }
        @keyframes alertPulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
        .alert .alert-name { font-size: 1.4rem; font-weight: 800; color: #fff; }
        .alert .alert-latin { font-size: .85rem; color: var(--text-dim); font-style: italic; margin-top: 4px; }

        /* ── Species list ── */
        .species-section { padding: 0 8px; }
        .cat-title {
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--gold);
            padding: 8px 4px 4px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cat-title .cat-count { font-size: .65rem; color: var(--text-dim); font-weight: 400; }

        .s-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding-bottom: 6px; }

        .s-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all .2s;
        }
        .s-card.observed { border-color: var(--gold); }
        .s-card.just-seen { animation: goldFlash .8s ease; }

        @keyframes goldFlash {
            0% { box-shadow: 0 0 0 rgba(212,168,66,0); }
            40% { box-shadow: 0 0 20px rgba(212,168,66,.6); }
            100% { box-shadow: 0 0 0 rgba(212,168,66,0); }
        }

        .s-card .s-thumb {
            width: 100%;
            height: 65px;
            object-fit: cover;
            display: block;
            background: var(--bg-elevated);
        }
        .s-card .s-thumb-ph {
            width: 100%; height: 65px;
            background: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .s-card .s-info { padding: 4px 6px 5px; }
        .s-card .s-name {
            font-size: .75rem;
            font-weight: 600;
            line-height: 1.15;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .s-card .s-latin {
            font-size: .62rem;
            color: var(--text-dim);
            font-style: italic;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .s-card .s-obs-tag {
            font-size: .6rem;
            background: var(--gold);
            color: #000;
            padding: 0 5px;
            border-radius: 4px;
            font-weight: 700;
            display: inline-block;
            margin-top: 2px;
        }

        .s-card.not-observed .s-thumb, .s-card.not-observed .s-thumb-ph { filter: grayscale(.6) brightness(.7); }

        /* ── Detail overlay ── */
        .detail-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 50;
            overflow-y: auto;
            display: none;
        }
        .detail-overlay.open { display: block; }
        .detail-back {
            padding: 10px 12px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            font-size: .85rem;
            color: var(--gold);
            cursor: pointer;
            font-weight: 600;
            border: none;
            width: 100%;
            text-align: left;
        }
        .detail-img { width: 100%; max-height: 180px; object-fit: cover; }
        .detail-body { padding: 12px; }
        .detail-body h2 { color: var(--gold); font-size: 1.05rem; margin-bottom: 2px; }
        .detail-body .latin { color: var(--text-dim); font-style: italic; font-size: .82rem; margin-bottom: 10px; }
        .detail-body .desc { font-size: .85rem; margin-bottom: 12px; line-height: 1.5; }
        .detail-body .field { margin-bottom: 5px; font-size: .82rem; }
        .detail-body .field strong { color: var(--gold); }
        .detail-body .credit { font-size: .7rem; color: var(--text-dim); margin-top: 10px; }
        .detail-body a { color: var(--gold); }

        /* ── Map tab ── */
        #panel-map { height: 300px; width: 100%; }

        /* ── Stats tab ── */
        .stats { padding: 12px; }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--bg-card);
            border-radius: var(--radius);
            margin-bottom: 6px;
            border: 1px solid var(--border);
        }
        .stat-label { font-size: .82rem; color: var(--text-dim); }
        .stat-value { font-size: 1.1rem; font-weight: 700; color: var(--gold); }

        .recent-obs { margin-top: 14px; }
        .recent-obs h3 { font-size: .82rem; color: var(--gold); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .03em; }
        .recent-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: .82rem;
        }
        .recent-item:last-child { border: none; }
        .recent-item .r-time { color: var(--text-dim); min-width: 38px; font-variant-numeric: tabular-nums; }
        .recent-item .r-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

        .footer {
            text-align: center;
            padding: 10px;
            font-size: .65rem;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
        }
        .footer a { color: var(--gold); text-decoration: none; }
    </style>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
</head>
<body>
    <div class="header">
        <span class="logo">OnlyFaune</span>
        <span class="session-name" id="p-session-name">—</span>
        <span class="live-dot" id="p-live-dot" style="display:none;"></span>
    </div>

    <div id="no-session" class="no-session">
        <div class="icon">🦉</div>
        <p>Aucune session d'observation en cours.</p>
        <p style="font-size:.8rem;margin-top:6px;">Revenez quand le stream commence !</p>
    </div>

    <div id="panel-main" style="display:none;">
        <div class="tabs">
            <button class="tab active" data-tab="guide">Guide</button>
            <button class="tab" data-tab="carte">Carte</button>
            <button class="tab" data-tab="stats">Stats</button>
        </div>

        <div id="tab-guide" class="tab-content active">
            <div id="species-container" class="species-section"></div>
        </div>

        <div id="tab-carte" class="tab-content">
            <div id="panel-map"></div>
            <div style="padding:8px 12px;">
                <p style="font-size:.82rem;"><strong style="color:var(--gold);">Zone :</strong> <span id="p-location-name">—</span></p>
            </div>
        </div>

        <div id="tab-stats" class="tab-content">
            <div class="stats">
                <div class="stat-row"><span class="stat-label">Espèces vues</span><span class="stat-value" id="st-session">0/0</span></div>
                <div class="stat-row"><span class="stat-label">Total observations</span><span class="stat-value" id="st-total">0</span></div>
                <div class="stat-row"><span class="stat-label">Durée</span><span class="stat-value" id="st-duration">—</span></div>
                <div class="recent-obs">
                    <h3>Dernières observations</h3>
                    <div id="recent-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert fullscreen -->
    <div class="alert" id="alert">
        <img class="alert-thumb" id="alert-thumb" src="" alt="">
        <div class="alert-text">
            <div class="alert-label">VU !</div>
            <div class="alert-name" id="alert-name"></div>
            <div class="alert-latin" id="alert-latin"></div>
        </div>
    </div>

    <!-- Detail overlay -->
    <div class="detail-overlay" id="detail">
        <button class="detail-back" id="detail-back">← Retour</button>
        <div id="detail-content"></div>
    </div>

    <div class="footer">
        Données : <a href="https://fr.wikipedia.org" target="_blank" rel="noopener">Wikipédia</a> · Photos : Wikimedia Commons
    </div>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="shared.js"></script>
    <script src="viewer.js"></script>
</body>
</html>
